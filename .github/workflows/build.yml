name: CI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

jobs:

  compile:
    name: Compile check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Compile sources
        run: ./gradlew compileDebugSources --no-daemon

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

  build:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: [ compile, test ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             artifacts/ScreenStream-debug-${SHORT}.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             artifacts/ScreenStream-release-unsigned-${SHORT}.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenStream-debug-${{ github.sha }}
          path: artifacts/ScreenStream-debug-*.apk
          retention-days: 30

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: ScreenStream-release-unsigned-${{ github.sha }}
          path: artifacts/ScreenStream-release-unsigned-*.apk
          retention-days: 30

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug and unsigned release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Screen Stream ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          body: |
            ## Screen Stream ${{ github.ref_name }}

            This project isn't code-signed for direct distribution; F-Droid
            is the intended signed release channel.

            ### Install
            Download `app-debug.apk` and sideload it:
            ```
            adb install app-debug.apk
            ```

            `app-release-unsigned.apk` is the release build variant without a
            signature, published for build verification (e.g. comparing
            against F-Droid's reproducible build of the same commit), not
            for direct installation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
