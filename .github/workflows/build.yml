name: CI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

jobs:

  compile:
    name: Compile check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Compile sources
        run: ./gradlew compileDebugSources --no-daemon

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

  build:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: [ compile, test ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename debug APK
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             artifacts/ScreenStream-debug-${SHORT}.apk

      - name: Rename release APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             artifacts/ScreenStream-release-unsigned-${SHORT}.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenStream-debug-${{ github.sha }}
          path: artifacts/ScreenStream-debug-*.apk
          retention-days: 30

      - name: Upload release APK (unsigned)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ScreenStream-release-unsigned-${{ github.sha }}
          path: artifacts/ScreenStream-release-unsigned-*.apk
          retention-days: 30

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH:     ${{ github.workspace }}/keystore.jks
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Screen Stream ${{ github.ref_name }}
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            ## Screen Stream ${{ github.ref_name }}

            ### Install
            Download `app-release.apk` and sideload it:
            ```
            adb install app-release.apk
            ```

            This APK is used as the reference binary for F-Droid's
            reproducible build verification of this release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
